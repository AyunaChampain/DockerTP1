---
# Playbook : déploie l'application (Docker, réseau, base, API, proxy)
# Usage    : ansible-playbook -i inventories/setup.yml playbook.yml --vault-password-file .vault_pass
- hosts: all
  gather_facts: true
  become: true

  roles:
    - { role: docker,   tags: docker }
    - { role: network,  tags: network }
    - { role: database, tags: database }
    - { role: app,      tags: app }
    - { role: front,    tags: front }
    - { role: proxy,    tags: proxy }
