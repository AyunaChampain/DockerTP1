name: CI devops 2025

on:
  # Launch this job on master and for pull requests
  push:
    branches: 'master'
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-24.04
    steps:
      # Checkout your GitHub code
      - uses: actions/checkout@v4

      # Set up JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Build and test the application
      - name: Build and test with Maven
        run: mvn clean test